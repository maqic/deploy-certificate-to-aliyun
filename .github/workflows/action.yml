name: Auto Renew and Deploy SSL Certificates

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 20 */2 *' # 每两个月的第二十天执行一次
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew-deploy-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install acme.sh
        env:
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y socat
          curl -fsSL https://get.acme.sh | sh -s email="${EMAIL}"
          ~/.acme.sh/acme.sh --set-default-ca --server letsencrypt

      - name: Prepare certificate directories
        env:
          DOMAINS: ${{ secrets.DOMAINS }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a domain_array <<< "${DOMAINS}"
          test "${#domain_array[@]}" -gt 0
          for domain in "${domain_array[@]}"; do
            domain="$(echo "${domain}" | xargs)"
            test -n "${domain}"
            mkdir -p "/home/runner/certs/${domain}"
          done

      - name: Obtain SSL certificates
        id: issue
        env:
          DOMAINS: ${{ secrets.DOMAINS }}
          Ali_Key: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          Ali_Secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a domain_array <<< "${DOMAINS}"
          index=0
          for domain in "${domain_array[@]}"; do
            domain="$(echo "${domain}" | xargs)"
            index=$((index + 1))
            echo "正在申请第 ${index} 个域名证书"
            ~/.acme.sh/acme.sh --issue --dns dns_ali -d "*.${domain}" \
              --key-file "/home/runner/certs/${domain}/privkey.pem" \
              --fullchain-file "/home/runner/certs/${domain}/fullchain.pem" \
              --server letsencrypt --force
          done

      - name: Verify certificate files
        id: verify_files
        env:
          DOMAINS: ${{ secrets.DOMAINS }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a domain_array <<< "${DOMAINS}"
          for domain in "${domain_array[@]}"; do
            domain="$(echo "${domain}" | xargs)"
            cert_file="/home/runner/certs/${domain}/fullchain.pem"
            key_file="/home/runner/certs/${domain}/privkey.pem"
            test -s "${cert_file}"
            test -s "${key_file}"
            openssl x509 -in "${cert_file}" -checkend 2592000 -noout
            cert_key_hash="$(openssl x509 -in "${cert_file}" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            private_key_hash="$(openssl pkey -in "${key_file}" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
            test "${cert_key_hash}" = "${private_key_hash}"
          done

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Upload certificates to Alibaba Cloud CDN
        id: upload
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          DOMAINS: ${{ secrets.DOMAINS }}
          ALIYUN_CDN_DOMAINS: "${{ secrets.ALIYUN_CDN_DOMAINS }},dodo.saibao.fun"
        run: python upload_certs_to_aliyun.py

      - name: Send renewal result email
        if: always()
        env:
          DOMAINS: ${{ secrets.DOMAINS }}
          ALIYUN_CDN_DOMAINS: "${{ secrets.ALIYUN_CDN_DOMAINS }},dodo.saibao.fun"
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: maqic51@gmail.com
          CERT_ROOT: /home/runner/certs
          ISSUE_OUTCOME: ${{ steps.issue.outcome }}
          FILES_OUTCOME: ${{ steps.verify_files.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python send_ssl_report.py

      - name: Clean up certificate files
        if: always()
        run: rm -rf /home/runner/certs
